<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tables</title>
</head>
<body>
    <h2> HTML TABLE TAG EXAMPLE</h2>
    <table border="1">
        <caption> Student Marks </caption>
        <colgroup>
            <col style="background-color: lightcyan;">
            <col style="background-color: lightcoral;">
            <col style="background-color: lightsalmon;">
        
        </colgroup>
        <thead>
        <tr>
            <th>Student Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        </thead>

        <tbody>
        <tr>
            <td rowspan="2" style="padding: 20px;">Ravi</td>
            <td>HTML</td>
            <td>99</td>
        </tr>

        <tr>
            <td>CSS</td>
            <td>98</td>
        </tr>

        <tr>
            <td rowspan="2" style="padding: 20px;">Raju</td>
            <td>HTML</td>
            <td>94</td>
        </tr>

        <tr>
            
            <td>CSS</td>
            <td>96</td>
        </tr>
        </tbody>
<tfoot>
        <tr>
            <td colspan="2">Total Students</td>
            <td>2</td>
        </tr>
</tfoot>
    </table>
</body>
</html>
