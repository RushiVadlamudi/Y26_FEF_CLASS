<html>
          <head>
                   <title>HTML LISTS</title>
          </head>
          <body>
<!-- UnOrdered list-->
###unordered list###
                  <ol type="1" start="5" reversed>
                          <li>HTML</li>
                          <li>CSS</li>
                          <li>JS</li>
                  </ol>

                  <ul style="list-style-type:circle;">
                          <li>HTML</li>
                          <li>CSS</li>
                          <li>JS</li>

                  </ul>
<!-- description list-->
###description list###
<dl>
        <dt>HTML</dt>
        <dd>Hyper Text Markup Language
        <dt>CSS</dt>
        <dd>Cascading Style Sheet

</dl>

<!-- Nested list-->
###Nested list###
<ul>
           <li>Frontend
                   <ol> <li>HTML</li>
                        <li>CSS</li>
                        <li>JS</li>
                   </ol>
</li>
           <li>Backend
                <ol> <li>java</li>

       </li>
<ul/>
          </body>
</html>
